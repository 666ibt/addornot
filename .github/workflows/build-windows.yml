name: Build Windows App

# Builds the TTN Waybill Splitter into a Windows installer (.exe) on GitHub's
# Windows machines. The finished installer is uploaded as a downloadable
# artifact on each run, and attached to a GitHub Release when you push a tag
# like "v1.0.0".

on:
  push:
    branches: [ "claude/ttn-waybill-splitter-app-pw5ct5" ]
    paths:
      - "saturn/**"
      - ".github/workflows/build-windows.yml"
    tags: [ "v*" ]
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write      # needed to attach the .exe to a Release on tag builds

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: saturn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: node --test test/extract.test.js test/approval.test.js test/num2words.test.js test/db.test.js test/docx.test.js test/contract.test.js

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: saturn-windows
          path: |
            saturn/release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release with installer
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.6
          name: Saturn v1.3.6
          target_commitish: ${{ github.sha }}
          files: saturn/release/*.exe
          body: |
            Готовое приложение для Windows. Node.js и терминал не требуются.
            Словари распознавания (рус+англ) встроены — работает офлайн,
            интернет не нужен.

            **Saturn 1.3.6 — «Сохранить этот» в «Объединить PDF»:**
            - У каждой страницы в «Объединить PDF» появилась кнопка
              «💾 Сохранить этот» — сохраняет эту страницу отдельным PDF
              (имя вида `исходный_стр3.pdf`), не собирая общий файл.
              Совпадающие имена не затирают друг друга (`…_2.pdf`, `…_3.pdf`).

            **Saturn 1.3.5 — сохранение по одному и мелкие правки:**
            - При сохранении ТТН по одному файлы с одинаковым именем больше
              не затирают друг друга: второй сохраняется как «имя_2.pdf»,
              третий — «имя_3.pdf» и т.д. (проверяется и то, что уже лежит
              в папке). То же и для «Фото → PDF».
            - Кнопка «💾 Сохранить этот» добавлена в «Фото → PDF» — можно
              сохранить отдельное изображение, не сохраняя всю пачку.
            - Заставка при запуске держится 1.5 секунды.

            **Saturn 1.3.4 — TIFF в «Фото → PDF»:**
            - Инструмент «Фото → PDF» теперь принимает файлы TIFF (.tif/.tiff)
              наравне с JPG и PNG — можно выбрать в диалоге или перетащить.
            - Многостраничный TIFF (частый формат сканов) разворачивается
              постранично: каждая страница TIFF становится страницей PDF.

            **Saturn 1.3.3 — экран загрузки:**
            - При запуске приложения показывается заставка с переливающимся
              логотипом Saturn (планета и кольцо переливаются цветами,
              по надписи «SATURN» пробегает блик). Заставка плавно исчезает,
              как только интерфейс готов.

            **Saturn 1.3.2 — договор ST с «цифровым» префиксом:**
            - Договор вида «ST-306/25-K» теперь распознаётся, даже когда OCR
              читает буквы «ST» как цифры (S→5, T→7/1) и номер приходит как
              «57-306/25-К» или «51-437/25-К». Раньше такие ТТН (SEG TASCO)
              получали «среднюю» уверенность и имя `…_NA`.
            - Кириллическая «К» в суффиксе договора приводится к латинской «K»
              (`ST-163/25-К` → `ST-163/25-K`).

            **Saturn 1.3.1 — надёжнее определение поворота:**
            - Ориентация страницы теперь подтверждается тем, что реально
              удалось прочитать номер накладной/договора, а не только «уверенностью»
              распознавания. Раньше в смешанной партии повёрнутый скан иногда
              принимался в неверном повороте и уходил в «низкую» уверенность с
              пустыми полями — теперь этого не происходит. Ускорение партий
              с одинаковым поворотом сохранено.

            **Saturn 1.3.0 — новый инструмент «Объединить PDF»:**
            - Объединяет несколько PDF в один файл. Страницы всех выбранных
              файлов показываются превью-карточками; порядок задаётся
              перетаскиванием или стрелками ↑/↓, лишние страницы можно убрать.
            - Имя итогового файла вводится вручную. Можно докидывать файлы
              кнопкой «＋ Добавить PDF…» или перетаскиванием.

            **Saturn 1.2.12 — сортировка и ускорение:**
            - Результаты с низкой уверенностью показываются первыми
              (низкая → средняя → высокая), чтобы их было проще проверить.
            - Обработка стала быстрее без потери качества: приложение
              запоминает ориентацию предыдущей страницы и пробует её первой.
              Сканы одной партии обычно повёрнуты одинаково, поэтому после
              первой страницы остальные распознаются за один проход
              (повёрнутые партии — примерно в 3 раза быстрее). Масштаб и
              проверка распознавания не изменились — точность прежняя.

            **Saturn 1.2.11 — новый вид договора AZT:**
            - Договор вида «AZT-…» (напр. `AZT-2/26`, из строки «Контракт:
              № AZT-…») теперь распознаётся. Раньше такие ТТН получали
              «среднюю» уверенность и имя `…_NA`.

            **Saturn 1.2.10 — TASCO в кириллице:**
            - Договор «…-TASCO» теперь распознаётся, даже когда OCR читает
              «TASCO» кириллицей («ТАЗСО», напр. `56/26-ТАЗСО`). Раньше такие
              ТТН получали «среднюю» уверенность и имя `…_NA`; теперь имя
              нормализуется к `56-26-TASCO`.

            **Saturn 1.2.9 — исправление двух ошибок:**
            - Кнопка «🗑 Удалить» теперь действительно исключает страницу:
              при «Сохранить всё» удалённые карточки больше не сохраняются.
            - Большие партии больше не подвешивают приложение. Страницы
              распознаются по одной (раньше все изображения партии держались
              в памяти сразу), а данные обработанной партии освобождаются
              при «Начать заново» — повторная загрузка большой партии
              работает стабильно.

            **Saturn 1.2.8 — договор ST со слипшимся «№»:**
            - Договор вида «ST-539/25-K» теперь распознаётся, даже когда «№»
              распознаётся как «Ne» и слипается с «ST» («NeST-539/25-K»).
              Раньше такие ТТН получали «среднюю» уверенность и имя `…_NA`.

            **Saturn 1.2.7 — договор АЗС и ускорение распознавания:**
            - Договор вида «АЗС» без «-С» (самовывоз, напр. `8/26-АЗС`)
              теперь распознаётся — раньше такие ТТН получали «среднюю»
              уверенность и имя `…_NA`.
            - Скорость: как только договор найден, страница обрабатывается
              за один проход OCR (раньше при «средней» уверенности шёл
              полный перебор поворотов). Для повёрнутых сканов перебор
              ориентаций сокращён по форме страницы — рабо­тает заметно быстрее.

            **Saturn 1.2.6 — удаление ненужных ТТН из списка:**
            - У каждой обработанной страницы появилась кнопка «🗑 Удалить» —
              убирает её из списка, чтобы при «Сохранить всё» она не сохранялась.
            - Исходный PDF при этом не меняется — удаляется только карточка
              из списка на проверку.

            **Saturn 1.2.5 — буквенный суффикс номера накладной:**
            - Если после номера накладной стоит «ч» или «тч» (напр.
              «№ 1125 тч», «№ 1431 ч») — буквы теперь попадают в имя файла:
              `1125тч_SGN-225-26.pdf`, `1431ч_SGN-223-26.pdf`.
            - Устойчиво к ошибкам OCR (одиночная «ч» на сканах часто читается
              как латинская «y») и не путает суффикс с шумом рамки таблицы.

            **Saturn 1.2.4 — распознавание новых видов договоров в ТТН:**
            - Обработка ТТН теперь распознаёт договоры **TASCO**
              (напр. `73/26-TASCO`) и **АЗС-С** (напр. `15/26-АЗС-С`) —
              берутся из строки «Контракт: Договор №…».
            - Строка «Основание: Согласно договору №…-ПР» (рамочный
              «собственный» договор) намеренно игнорируется.
            - Тот же список видов добавлен в AI-подсказку (резервное
              распознавание через Claude).

            **Saturn 1.2.3 — оформление интерфейса:**
            - Поля ввода в форме «Оформление договора» приведены к единому
              стилю (раньше часть полей была без стилей — тонкие/разной
              высоты). Одинаковая высота, рамки, подсветка при фокусе.
            - Выпадающие списки — единый вид со своей стрелкой.
            - Тонкий полоса прокрутки в стиле приложения.

            **Saturn 1.2.2 — правки оформления договора:**
            - Пункт 1.3 — выбор «Етказиб берувчи является/не является
              производителем» (по умолчанию — не является).
            - Служебная записка: основание «в счёт собственных импортных
              объёмов / прогнозных выработок» выбирается в форме.
            - Акциз переключает и пункт 1.2 (для собственных нужд /
              для перепродажи).
            - «Вид договора» — выпадающий список шаблонов (можно добавить свой).
            - «№ договора» — вводятся только цифры, год и префикс/суффикс
              подставляются автоматически (предпросмотр под полем).
            - «Пункт отгрузки» — выпадающий список (Чиноз / ФНПЗ).

            **Оформление договоров (из 1.2.0):**

            - **Оформление договора** — формирует договор (узб., кириллица),
              лист согласования (только SEG TASCO) и служебную записку по
              вашим реальным шаблонам. Сумма прописью — узбекской кириллицей.
              Переключатель акциза, выбор адресата записки, склонение товара.
            - **Контрагенты** — база по компаниям SEGNUM и SEG TASCO
              (реквизиты, директор, банк). Выбор из базы или ручной ввод с
              автосохранением.
            - **Продукты** — каталог продукции с ценой за тонну.

            Плюс прежние инструменты: Обработка ТТН, Разделитель PDF,
            Фото → PDF, Определитель листов согласования.

            **Два варианта в разделе Assets ниже:**

            - **`Saturn-1.3.6-portable.exe`** — портативная версия.
              Ничего не устанавливает: скачал и сразу запустил. Рекомендуется.
            - **`Saturn Setup 1.3.6.exe`** — обычный установщик.

            При первом запуске Windows покажет SmartScreen («Windows защитила
            ваш компьютер») — приложение не подписано платным сертификатом.
            Нажмите **«Подробнее» → «Выполнить в любом случае»**.
