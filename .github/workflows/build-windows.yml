name: Build Windows App

# Builds the TTN Waybill Splitter into a Windows installer (.exe) on GitHub's
# Windows machines. The finished installer is uploaded as a downloadable
# artifact on each run, and attached to a GitHub Release when you push a tag
# like "v1.0.0".

on:
  push:
    branches: [ "claude/ttn-waybill-splitter-app-pw5ct5" ]
    paths:
      - "saturn/**"
      - ".github/workflows/build-windows.yml"
    tags: [ "v*" ]
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write      # needed to attach the .exe to a Release on tag builds

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: saturn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: node --test test/extract.test.js

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: saturn-windows
          path: |
            saturn/release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release with installer
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.12
          name: Saturn v1.0.12
          target_commitish: ${{ github.sha }}
          files: saturn/release/*.exe
          body: |
            Готовое приложение для Windows. Node.js и терминал не требуются.
            Словари распознавания (рус+англ) встроены — работает офлайн,
            интернет не нужен.

            Новое в Saturn 1.0.12: параллельная обработка на всех ядрах —
            многостраничные файлы и перевёрнутые страницы обрабатываются
            заметно быстрее без потери точности.

            **Два варианта в разделе Assets ниже:**

            - **`Saturn-1.0.12-portable.exe`** — портативная версия.
              Ничего не устанавливает: скачал и сразу запустил. Рекомендуется.
            - **`Saturn Setup 1.0.12.exe`** — обычный установщик.

            При первом запуске Windows покажет SmartScreen («Windows защитила
            ваш компьютер») — приложение не подписано платным сертификатом.
            Нажмите **«Подробнее» → «Выполнить в любом случае»**.
