name: Build Windows App

# Builds the TTN Waybill Splitter into a Windows installer (.exe) on GitHub's
# Windows machines. The finished installer is uploaded as a downloadable
# artifact on each run, and attached to a GitHub Release when you push a tag
# like "v1.0.0".

on:
  push:
    branches: [ "claude/ttn-waybill-splitter-app-pw5ct5" ]
    paths:
      - "ttn_splitter_app/**"
      - ".github/workflows/build-windows.yml"
    tags: [ "v*" ]
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write      # needed to attach the .exe to a Release on tag builds

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ttn_splitter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: node --test test/extract.test.js

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttn-waybill-splitter-windows
          path: |
            ttn_splitter_app/release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release with installer
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: TTN Waybill Splitter v1.0.5
          target_commitish: ${{ github.sha }}
          files: ttn_splitter_app/release/*.exe
          body: |
            Готовое приложение для Windows. Node.js и терминал не требуются.
            Словари распознавания (рус+англ) встроены — работает офлайн,
            интернет не нужен.

            Улучшено распознавание накладных ФНПЗ: полный номер накладной
            (8 цифр) и договор вида ST-248/26-KS.

            **Два варианта в разделе Assets ниже:**

            - **`TTN-Waybill-Splitter-1.0.5-portable.exe`** — портативная версия.
              Ничего не устанавливает: скачал и сразу запустил. Рекомендуется.
            - **`TTN Waybill Splitter Setup 1.0.5.exe`** — обычный установщик.

            При первом запуске Windows покажет SmartScreen («Windows защитила
            ваш компьютер») — приложение не подписано платным сертификатом.
            Нажмите **«Подробнее» → «Выполнить в любом случае»**.
