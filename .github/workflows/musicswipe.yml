name: MusicSwipe

# Проверка проекта без локального Mac и без Xcode:
#   logic   — юнит-тесты чистой логики (Linux, быстро и бесплатно)
#   ios     — сборка приложения и запуск в симуляторе на macOS-раннере,
#             со скриншотом в артефактах
#   ipa     — неподписанный .ipa для установки на свой iPhone
#             (только по кнопке: минуты macOS расходуются с коэффициентом x10)
#   backend — сквозная проверка живого проекта Supabase (если заданы секреты)

on:
  push:
    branches: ["**"]
    paths:
      - "musicswipe/**"
      - ".github/workflows/musicswipe.yml"
  pull_request:
    paths:
      - "musicswipe/**"
      - ".github/workflows/musicswipe.yml"
  workflow_dispatch:
    inputs:
      build_ipa:
        description: "Собрать неподписанный .ipa для установки на устройство"
        type: boolean
        default: true

defaults:
  run:
    shell: bash

jobs:
  logic:
    name: Юнит-тесты Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Тесты
        working-directory: musicswipe
        run: deno test supabase/functions/

      - name: Проверка типов
        working-directory: musicswipe
        run: deno check supabase/functions/*/index.ts

  mobile:
    name: Приложение Expo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: musicswipe/mobile/package-lock.json

      - name: Зависимости
        working-directory: musicswipe/mobile
        run: npm ci

      - name: Проверка типов
        working-directory: musicswipe/mobile
        run: |
          # expo-env.d.ts генерируется при первом expo start и не хранится
          # в репозитории — в CI создаём заглушку сами.
          [ -f expo-env.d.ts ] || printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
          npx tsc --noEmit

      - name: Сборка бандла
        working-directory: musicswipe/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        # Metro собирает iOS-бандл и на Linux: ошибки импортов и структуры
        # маршрутов ловятся здесь, без macOS-раннера и его множителя минут.
        run: npx expo export --platform ios --output-dir dist

  ios:
    name: Сборка iOS и скриншот
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Версия Xcode
        run: |
          xcodebuild -version
          # Файл проекта в формате objectVersion 77 — нужен Xcode 16 или новее.
          xcodebuild -version | head -1 | grep -qE 'Xcode 1[6-9]' \
            || { echo "::error::Нужен Xcode 16+"; exit 1; }

      - name: Выбрать симулятор
        id: sim
        run: |
          # Не привязываемся к конкретной модели: берём первый доступный iPhone,
          # иначе workflow ломается при каждом обновлении образа раннера.
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F-]{36}')
          if [ -z "$UDID" ]; then echo "::error::Не нашли доступный симулятор iPhone"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -m1 'iPhone'

      - name: Подставить ключи Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: musicswipe/ios/scripts/make-config.sh

      - name: Сборка
        working-directory: musicswipe/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project MusicSwipe.xcodeproj \
            -scheme MusicSwipe \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tail -60

      - name: Запуск в симуляторе
        working-directory: musicswipe/ios
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/MusicSwipe.app
          xcrun simctl launch "$UDID" com.musicswipe.app
          # Даём приложению восстановить сессию и отрисовать первый экран.
          sleep 10
          xcrun simctl io "$UDID" screenshot screenshot.png
          # Логи приложения за время запуска — там будут ошибки сети и декодирования.
          xcrun simctl spawn "$UDID" log show --last 30s --predicate 'process == "MusicSwipe"' \
            --style compact > app.log || true

      - name: Артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musicswipe-simulator
          path: |
            musicswipe/ios/screenshot.png
            musicswipe/ios/app.log
          if-no-files-found: warn

  ipa:
    name: Неподписанный .ipa
    # Только вручную: у macOS-раннера множитель минут x10, не нужно жечь их
    # на каждый пуш.
    if: github.event_name == 'workflow_dispatch' && inputs.build_ipa
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Подставить ключи Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: musicswipe/ios/scripts/make-config.sh

      - name: Архив без подписи
        working-directory: musicswipe/ios
        env:
          # Идентификатор по умолчанию может быть занят чужим приложением.
          # Задайте переменную репозитория BUNDLE_ID вида com.ваше-имя.musicswipe.
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project MusicSwipe.xcodeproj \
            -scheme MusicSwipe \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MusicSwipe.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID:-com.musicswipe.app}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -40

      - name: Упаковать в .ipa
        working-directory: musicswipe/ios
        run: |
          # .ipa — это zip с папкой Payload. Подпись поставит Sideloadly
          # или AltStore уже на вашей стороне, вашим Apple ID.
          mkdir -p build/Payload
          cp -R build/MusicSwipe.xcarchive/Products/Applications/MusicSwipe.app build/Payload/
          cd build && zip -qry MusicSwipe-unsigned.ipa Payload
          ls -lh MusicSwipe-unsigned.ipa

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: MusicSwipe-unsigned-ipa
          path: musicswipe/ios/build/MusicSwipe-unsigned.ipa
          if-no-files-found: error

  backend:
    name: Сквозная проверка Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Smoke-тест
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_PLAYLIST_URL: ${{ vars.TEST_PLAYLIST_URL }}
        working-directory: musicswipe
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Секреты SUPABASE_URL / SUPABASE_ANON_KEY не заданы — пропускаем."
            exit 0
          fi
          node supabase/scripts/smoke-test.mjs \
            "${TEST_PLAYLIST_URL:-https://www.deezer.com/playlist/1313621735}"
