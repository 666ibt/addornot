# Описание проекта для XcodeGen.
#
# В репозитории уже лежит готовый MusicSwipe.xcodeproj — он открывается
# в Xcode 16+ как есть. Этот файл нужен, если проект хочется пересобрать
# с нуля (например, после конфликта в project.pbxproj):
#
#   brew install xcodegen && xcodegen generate
name: MusicSwipe
options:
  bundleIdPrefix: com.musicswipe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  MusicSwipe:
    type: application
    platform: iOS
    sources:
      - path: MusicSwipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musicswipe.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: MusicSwipe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
